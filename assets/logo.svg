<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 6 84 84" role="img" aria-labelledby="title">
  <title id="title">Mordye</title>
  <!-- A ribbon M that enters as one color and leaves as four, ending in a drop of dye.
       Every color shares one OKLCH lightness (0.67) and chroma (0.15). Each fold is a
       real cutout, so the mark works on any background. -->

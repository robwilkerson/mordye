    <mask id="mordye-s2" maskUnits="userSpaceOnUse" x="0" y="0" width="96" height="96"><path d="M47.5 55 L78 17" stroke="#fff" stroke-width="14" stroke-linecap="round" fill="none"/><path d="M78 17 L78 58" stroke="#000" stroke-width="20" stroke-linecap="round" fill="none"/></mask>
    <mask id="mordye-s3" maskUnits="userSpaceOnUse" x="0" y="0" width="96" height="96"><path d="M78 17 L78 58" stroke="#fff" stroke-width="14" stroke-linecap="round" fill="none"/><path d="M71 58 C71 64 76 64 76 68 C76 72 70.5 73.25 70.5 80 A7.5 7.5 0 0 0 85.5 80 C85.5 73.25 80 72 80 68 C80 64 85 64 85 58 Z" fill="#fff"/></mask>
  </defs>

# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
tone_instructions: "Be direct and concise. Focus on correctness, security, architecture, idioms, and consistency."
early_access: false

# The project's review rules live in CLAUDE.md, which CodeRabbit reads as
# coding guidelines; keep them there rather than in path instructions here.
knowledge_base:
  code_guidelines:
    enabled: true

reviews:
  profile: "chill"
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: >-
    Create concise release notes as a bullet-point list, but only if the
    original PR body is insufficient or inaccurate. Extend or clarify the
    PR body content; don't duplicate it.
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  # Requests changes on blocking findings and approves once they're resolved.
  # .github/workflows/ready-on-approval.yml takes the PR out of draft then.
  auto_approvals:
    enabled: true
  commit_status: true
  review_status: false
  poem: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  suggested_reviewers: false

  path_filters:
    # Upstream theme files and ports, copied unchanged and credited in the
    # README. Matches ai-review.yml's ignore.glob, so both reviewers see the
    # same files.
    - "!adapter/*/testdata/**"
    - "!converters/*/testdata/**"

  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
    # PRs open as drafts so the bot reviews before humans are requested.
    drafts: true
    base_branches:
      - "main"
    # Renovate PRs are mechanical dependency updates; CI still validates them.
    # renovate.json puts this label on every PR it opens.
    labels:
      - "!🤖 Renovate"

  tools:
    golangci-lint:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    github-checks:
      enabled: true

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

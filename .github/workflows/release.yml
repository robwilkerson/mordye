name: 🚀 Release

# Publishes a GitHub release when a v* tag is pushed. GoReleaser (configured in
# .goreleaser.yaml) builds the RPMs, archives, and checksums.txt; this workflow
# supplies the release notes from CHANGELOG.md and attests what it built.
on:
  push:
    # Tag filters are globs, not regex, so this only sieves. "Check the tag"
    # does the real format check.
    tags: ['v*']

permissions:
  contents: write # create the release
  id-token: write # sign the provenance attestations
  attestations: write # store them

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # GoReleaser reads the tags from history, so fetch all of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Check the tag
        id: tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-<prerelease>"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # A release's notes are its own CHANGELOG.md section, which `just release`
      # writes before tagging. A prerelease has no section of its own, so it
      # ships what's under ## Unreleased.
      - name: Extract release notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          heading="## $VERSION"
          [[ "$VERSION" == *-* ]] && heading="## Unreleased"
          awk -v h="$heading" '$0==h{p=1;next} p&&/^## /{exit} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [[ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" ]]; then
            echo "::error::No notes under '$heading' in CHANGELOG.md at $TAG" && exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # One attestation per file listed in checksums.txt: every RPM and archive.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

name: 🤖 AI Code Review

# Reviews pull requests with PR-Agent (https://github.com/The-PR-Agent/pr-agent)
# on GPT-5.2, a different model family from the one that writes the code. Every
# PR gets one review when it opens, draft or not. Each push to a draft gets
# another, so the iterating happens before a human is asked to look. Otherwise
# it reviews only on demand: comment /review, /improve, or /ask on the PR.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

# Each job asks for what it needs.
permissions: {}

jobs:
  review:
    name: Automated Code Review
    # Only the owner spends the model budget. Automatic reviews run on PRs
    # from this repo, and on pushes only while the PR is a draft. Commands
    # (/review, /improve, /ask) run only for the owner, on any PR, so the
    # owner can choose to review a fork PR; a stranger's comment can't run it.
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.action != 'synchronize' || github.event.pull_request.draft))
        || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.author_association == 'OWNER'
          && (startsWith(github.event.comment.body, '/review')
            || startsWith(github.event.comment.body, '/improve')
            || startsWith(github.event.comment.body, '/ask')))
      )
    # A new push supersedes the review in progress. Each command gets its own
    # group: GitHub keeps only one pending job per group, so a shared one would
    # drop a queued command when the next arrived. It sits on the job, after
    # the if, so a skipped run (a bot's comment, say) can't cancel a real one.
    concurrency:
      group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.comment.id || 'push' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # PR comments go through the issues API
      pull-requests: write
    steps:
      # Pinned by digest. Its attestation shows The-PR-Agent's publish workflow
      # built it from the v0.50.0 tag. Renovate keeps the pin current.
      - name: Review
        uses: docker://pragent/pr-agent:0.50.0-github_action@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe
        env:
          OPENAI_KEY: ${{ secrets.PRAGENT_LLM_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # No fallback model: a failed call should fail visibly, not quietly
          # review with something else.
          config.model: gpt-5.2
          config.fallback_models: '[]'
          # Bugs here tend to span functions, such as two calls whose order
          # matters, so the model sees more code around each change and
          # reasons longer about it. PRs are small; the extra cost is modest.
          config.reasoning_effort: high
          # High effort on a large diff runs past PR-Agent's 120s default.
          config.ai_timeout: '300'
          # The largest prompt PR-Agent builds. Its 32K default pruned most of
          # a large PR's files before the model saw them.
          config.max_model_tokens: '128000'
          config.patch_extra_lines_before: '20'
          config.patch_extra_lines_after: '10'
          config.max_extra_lines_before_dynamic_context: '30'
          # Don't re-post inline findings already on the PR from an earlier run.
          config.persistent_inline_comments: 'true'
          # Review against the project's own rules. CLAUDE.md is the one place
          # they live; it's read from the target branch, so a PR that changes a
          # rule is reviewed against the old one.
          config.repo_context_files: '["CLAUDE.md"]'
          # Upstream theme fixtures, copied unchanged; nothing to review. Matches
          # .coderabbit.yaml's path filters, so both reviewers see the same files.
          ignore.glob: '["adapter/*/testdata/**", "converters/*/testdata/**"]'
          # Review only. /describe would rewrite the PR body, and /improve
          # doubles the cost; both stay available on demand.
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'false'
          github_action_config.auto_improve: 'false'
          github_action_config.pr_actions: '["opened", "reopened"]'
          github_action_config.handle_push_trigger: 'true'
          github_action_config.push_commands: '["/review"]'
          # Labels follow the repo's own type and priority scheme.
          pr_reviewer.enable_review_labels_security: 'false'
          pr_reviewer.enable_review_labels_effort: 'false'
          # The most findings one /review reports; PR-Agent's default is 3.
          pr_reviewer.num_max_findings: '10'
          # Each finding goes on the lines it's about; only findings that can't
          # be placed stay in the summary comment.
          pr_reviewer.inline_key_issues: 'true'
          # Quiet by design: drop the summary's intro line and its effort and
          # tests rows, which carry no findings, and the comment announcing an
          # in-place update.
          pr_reviewer.enable_intro_text: 'false'
          pr_reviewer.require_estimate_effort_to_review: 'false'
          pr_reviewer.require_tests_review: 'false'
          pr_reviewer.final_update_message: 'false'
